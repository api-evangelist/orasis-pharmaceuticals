aid: orasis-pharmaceuticals
name: Orasis Pharmaceuticals
description: >-
  Orasis Pharmaceuticals is an ophthalmic pharmaceutical company with offices in the United States
  and Israel, focused on treatments for presbyopia — the age-related loss of near vision that affects
  roughly two billion people worldwide. Its lead product, QLOSI (pilocarpine hydrochloride ophthalmic
  solution) 0.4%, is a preservative-free, single-use-vial prescription eye drop approved by the FDA in
  October 2023 and commercially available in the United States, with a follow-on candidate (BESKA)
  submitted for approval in Australia. The company is backed by life-sciences investors including
  Sequoia Capital, Johnson & Johnson Innovation and Arboretum Ventures. Orasis sells a regulated
  pharmaceutical product, not software: it operates a corporate marketing site plus product sites for
  patients (qlosi.com) and eye care professionals (qlosiecp.com), and publishes no developer program,
  public API, SDK, webhook surface or machine-readable API contract of any kind.
